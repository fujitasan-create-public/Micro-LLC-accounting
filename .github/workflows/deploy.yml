# デプロイ（設計書 12.3）
# wrangler.jsonc の <D1_ID> / <KV_ID> を実際の ID に置き換え、
# GitHub Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してから手動で実行する。
# 本番のマイグレーションの前に、画面「設定値・エクスポート」から手動エクスポート（FR-71）を実行すること。
name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Test domain (pytest)
        working-directory: apps/api
        # テストが無い場合（終了コード 5）は成功として扱う
        run: uv run pytest || [ $? -eq 5 ]

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx --prefix ../web wrangler d1 migrations apply ledger --remote

      - name: Apply seed data (idempotent)
        working-directory: apps/api
        run: |
          for f in ../../seed/*.sql; do
            npx --prefix ../web wrangler d1 execute ledger --remote --file "$f"
          done

      - name: Deploy api
        working-directory: apps/api
        run: uv run --group workers pywrangler deploy

      - name: Deploy jobs
        working-directory: apps/jobs
        run: uv run --group workers pywrangler deploy

      - name: Deploy web
        working-directory: apps/web
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
